<style>
/* Layout: eine schmale Handyspalte; grüne Kopfleiste, darunter der gewundene Pfad.
   Übungen und Ergebnis sind eigene Bildschirme in derselben Spalte. */
:root {
  --green: #58cc02;
  --green-edge: #46a302;
  --green-soft: #d7ffb8;
  --green-ink: #2f7a00;
  --yellow-light: #fff3a6;       /* Französisch → Deutsch */
  --yellow-light-edge: #e3cf5a;
  --yellow-sun: #ffcf1a;         /* Deutsch → Französisch */
  --yellow-sun-edge: #d9a600;
  --yellow-amber: #f59a0b;       /* Grammatik & Lückentext */
  --yellow-amber-edge: #c27503;
  --yellow-ink: #6b4700;
  --review: #ce82ff;             /* Wiederholung der Fehlerwörter */
  --review-edge: #a05fd0;
  --review-ink: #6a2fa0;
  --gold: #ffd43b;
  --gold-edge: #b88600;
  --red: #ff4b4b;
  --red-soft: #ffdfe0;
  --red-ink: #b3261e;
  --ink: #3c3c3c;
  --muted: #777777;
  --line: #e5e5e5;
  --line-edge: #cfcfcf;
  --paper: #ffffff;
  --mist: #f7f7f7;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --amp: clamp(44px, 19vw, 84px);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
[hidden] { display: none !important; }
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
button:focus-visible, input:focus-visible { outline: 3px solid #1cb0f6; outline-offset: 2px; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; position: relative; }
.screen { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

/* ---------- Kopfleiste ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--green);
  color: #fff;
  display: flex; align-items: center; gap: 10px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
  border-bottom: 4px solid var(--green-edge);
}
.topbar img { width: 38px; height: 38px; border-radius: 11px; border: 2px solid rgba(255,255,255,.75); flex: none; }
.topbar .title { flex: 1; min-width: 0; font-weight: 800; font-size: 17px; line-height: 1.15; }
.topbar .title small { display: block; font-weight: 700; font-size: 12px; opacity: .9; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: #fff; color: var(--ink);
  border-radius: 999px; padding: 5px 11px;
  font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums;
  flex: none;
}
.chip .unit { font-weight: 700; font-size: 11px; color: var(--muted); }

/* ---------- Startseite ---------- */
.home-main { flex: 1; padding: 16px 16px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.intro h1 { margin: 0; font-size: 22px; font-weight: 800; line-height: 1.2; }
.intro p { margin: 4px 0 0; color: var(--muted); font-weight: 600; font-size: 14px; }
.legend { list-style: none; margin: 0; padding: 12px 14px; display: grid; gap: 8px; background: var(--mist); border-radius: 16px; }
.legend li { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; }
.legend .dot { width: 30px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--yellow-ink); }
.legend .dot svg { width: 15px; height: 15px; }
.dot.t-mc { background: var(--yellow-light); box-shadow: 0 3px 0 var(--yellow-light-edge); }
.dot.t-speak { background: var(--yellow-sun); box-shadow: 0 3px 0 var(--yellow-sun-edge); }
.dot.t-cloze { background: var(--yellow-amber); box-shadow: 0 3px 0 var(--yellow-amber-edge); }
.legend .dot.t-review { background: var(--review); box-shadow: 0 3px 0 var(--review-edge); color: #fff; }
.note { margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--red-soft); color: var(--red-ink); font-weight: 700; font-size: 13px; }

.path { position: relative; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 6px 0 10px; }
.trail { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; }
.group {
  position: relative; z-index: 1;
  background: var(--paper); border: 2px solid var(--line); border-radius: 999px;
  padding: 5px 16px; font-weight: 800; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
  margin-top: 6px; max-width: 100%; text-align: center;
}
.row { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; transform: translateX(calc(var(--k, 0) * var(--amp))); }
.node {
  width: 72px; height: 64px; border-radius: 50%; border: 0; padding: 0;
  display: grid; place-items: center; position: relative;
  transition: transform .08s, box-shadow .08s;
}
.node svg { width: 30px; height: 30px; }
.node:active { transform: translateY(5px); }
.node.t-mc.s-open { background: var(--yellow-light); box-shadow: 0 8px 0 var(--yellow-light-edge); color: var(--yellow-ink); }
.node.t-speak.s-open { background: var(--yellow-sun); box-shadow: 0 8px 0 var(--yellow-sun-edge); color: var(--yellow-ink); }
.node.t-cloze.s-open { background: var(--yellow-amber); box-shadow: 0 8px 0 var(--yellow-amber-edge); color: var(--yellow-ink); }
.node.t-review.s-open { background: var(--review); box-shadow: 0 8px 0 var(--review-edge); color: #fff; }
.node.t-review.s-open:active { box-shadow: 0 3px 0 var(--review-edge); }
.node.t-mc.s-open:active { box-shadow: 0 3px 0 var(--yellow-light-edge); }
.node.t-speak.s-open:active { box-shadow: 0 3px 0 var(--yellow-sun-edge); }
.node.t-cloze.s-open:active { box-shadow: 0 3px 0 var(--yellow-amber-edge); }
.node.s-done, .node.s-perfect { background: var(--green); box-shadow: 0 8px 0 var(--green-edge); color: #fff; }
.node.s-done:active, .node.s-perfect:active { box-shadow: 0 3px 0 var(--green-edge); }
.node.s-perfect svg { width: 38px; height: 38px; }
.node.s-locked { background: var(--line); box-shadow: 0 8px 0 var(--line-edge); color: #afafaf; }
.node.s-open::after {
  content: ""; position: absolute; inset: -9px -8px -15px; border-radius: 50%;
  border: 4px solid var(--line); pointer-events: none;
}
.node.shake { animation: shake .3s; }
.row .label { font-weight: 800; font-size: 12px; color: var(--muted); background: var(--paper); padding: 0 6px; border-radius: 6px; }
.row.is-open .label { color: var(--ink); }
.row.is-review.is-open .label { color: var(--review-ink); }
.row.has-bubble { margin-top: 30px; }
.bubble {
  position: absolute; top: -34px; left: 50%; transform: translateX(-50%);
  background: var(--paper); border: 2px solid var(--line); border-radius: 10px;
  padding: 3px 10px; font-weight: 800; font-size: 13px; color: var(--green-ink); text-transform: uppercase; letter-spacing: .04em;
  white-space: nowrap; animation: bob 1.6s ease-in-out infinite;
}
.home-foot { text-align: center; margin-top: 8px; }
.linkbtn { background: none; border: 0; padding: 10px; color: var(--muted); font-weight: 700; font-size: 13px; text-decoration: underline; }

/* ---------- Übung ---------- */
.lesson-top { display: flex; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 8px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; color: #afafaf; font-size: 24px; font-weight: 800; line-height: 1; flex: none; }
.track { flex: 1; height: 16px; background: var(--line); border-radius: 999px; overflow: hidden; }
.track .fill { height: 100%; width: 0; background: var(--green); border-radius: 999px; transition: width .3s; }
.lesson-top .chip { background: var(--mist); }
.lesson-body { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 12px 16px 190px; }
.kicker { margin: 0; font-weight: 800; font-size: 20px; line-height: 1.25; }
.tag { align-self: flex-start; background: var(--yellow-sun); color: var(--yellow-ink); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding: 3px 10px; border-radius: 999px; }
.prompt {
  border: 2px solid var(--line); border-radius: 16px; padding: 18px 16px;
  display: flex; align-items: center; gap: 12px;
}
.prompt .text { flex: 1; min-width: 0; font-weight: 800; font-size: 24px; line-height: 1.3; overflow-wrap: anywhere; }
.prompt .text small { display: block; font-weight: 700; font-size: 14px; color: var(--muted); margin-top: 2px; }
.prompt.sentence .text { font-size: 20px; font-weight: 700; }
.gap { display: inline-block; min-width: 72px; border-bottom: 3px solid var(--ink); text-align: center; color: var(--green-ink); font-weight: 800; padding: 0 4px; }
.sound { width: 46px; height: 46px; border-radius: 14px; border: 0; background: #1cb0f6; box-shadow: 0 4px 0 #1899d6; color: #fff; font-size: 20px; flex: none; }
.sound:active { transform: translateY(3px); box-shadow: 0 1px 0 #1899d6; }
.options { display: grid; gap: 10px; }
.options.two { grid-template-columns: 1fr 1fr; }
.opt {
  background: var(--paper); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 14px;
  padding: 13px 14px; font-weight: 700; font-size: 17px; text-align: center; min-height: 54px; overflow-wrap: anywhere;
}
.opt:active { transform: translateY(2px); border-bottom-width: 3px; margin-bottom: 2px; }
.opt.good { background: var(--green-soft); border-color: var(--green); color: var(--green-ink); }
.opt.bad { background: var(--red-soft); border-color: var(--red); color: var(--red-ink); animation: shake .3s; }
.opt:disabled { cursor: default; }
.opt:disabled:not(.good):not(.bad) { opacity: .55; }

.speak { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.mic {
  width: 112px; height: 112px; border-radius: 50%; border: 0;
  background: var(--yellow-sun); box-shadow: 0 8px 0 var(--yellow-sun-edge); color: var(--yellow-ink);
  display: grid; place-items: center;
}
.mic svg { width: 48px; height: 48px; }
.mic:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--yellow-sun-edge); }
.mic.listening { background: var(--red); box-shadow: 0 8px 0 #d33131; color: #fff; animation: pulse 1s ease-in-out infinite; }
.status { margin: 0; min-height: 44px; text-align: center; font-weight: 700; font-size: 15px; color: var(--muted); }
.status.warn { color: var(--red-ink); }
.typed { width: 100%; border: 2px solid var(--line); border-radius: 14px; padding: 13px 14px; font: inherit; font-weight: 700; font-size: 17px; color: var(--ink); background: var(--mist); }
.typed.shake { animation: shake .3s; border-color: var(--red); }
.wide {
  width: 100%; border: 0; border-radius: 14px; padding: 14px 16px; font-weight: 800; font-size: 16px;
  background: var(--green); color: #fff; box-shadow: 0 5px 0 var(--green-edge);
}
.wide:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--green-edge); }
.wide.ghost { background: var(--paper); color: var(--muted); box-shadow: none; border: 2px solid var(--line); border-bottom-width: 5px; }
.wide.ghost:active { border-bottom-width: 3px; margin-bottom: 2px; box-shadow: none; }

.feedback {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  transform: translateY(105%); transition: transform .15s ease-out;
}
.feedback.show { transform: translateY(0); }
.feedback .inner { max-width: 480px; margin: 0 auto; padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; }
.feedback.good .inner { background: var(--green-soft); color: var(--green-ink); }
.feedback.bad .inner { background: var(--red-soft); color: var(--red-ink); }
.feedback .head { margin: 0; font-weight: 800; font-size: 20px; }
.feedback .detail { margin: 0; font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
.feedback .sub { margin: 0; font-weight: 600; font-size: 14px; opacity: .9; }
.feedback .actions { display: flex; gap: 10px; align-items: stretch; }
.feedback .actions .sound { height: auto; min-height: 50px; }
.feedback.bad .wide { background: var(--red); box-shadow: 0 5px 0 #d33131; }

/* ---------- Ergebnis ---------- */
.result-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 32px 16px; text-align: center; }
.result-main img { width: 128px; height: 128px; border-radius: 34px; }
.result-main h1 { margin: 0; font-size: 28px; font-weight: 800; color: var(--green-ink); text-wrap: balance; }
.result-main p { margin: 0; font-weight: 700; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.stat { border: 2px solid var(--line); border-radius: 16px; padding: 12px 6px; }
.stat b { display: block; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.result-foot { padding: 0 16px calc(24px + env(safe-area-inset-bottom, 0px)); }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: #fff; font-weight: 700; font-size: 14px; padding: 10px 16px; border-radius: 12px; z-index: 40;
  max-width: calc(100% - 32px); text-align: center;
}

@keyframes shake { 0%,100% { translate: 0; } 25% { translate: -6px; } 75% { translate: 6px; } }
@keyframes bob { 0%,100% { margin-top: 0; } 50% { margin-top: -5px; } }
@keyframes pulse { 0%,100% { scale: 1; } 50% { scale: 1.06; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

  };
  function stopSpeech() {
    if (recTimer) { clearTimeout(recTimer); recTimer = null; }
    if (rec) {
      var r = rec;
      rec = null;
      try { r.onresult = null; r.onerror = null; r.onend = null; r.abort(); } catch (e) { /* schon beendet */ }
    }
  }
  function listen(task, ui) {
    if (!Recognition || !lesson || lesson.locked) return;
    if (rec) { stopSpeech(); ui.idle(); return; }
    var myToken = lesson.token;
    var r;
    try { r = new Recognition(); } catch (e) { ui.warn(MIC_ERRORS["service-not-allowed"]); return; }
    r.lang = "fr-FR";
    r.continuous = false;
    r.interimResults = false;
    try { r.maxAlternatives = 5; } catch (e) { /* optional */ }
    var handled = false;
    function alive() { return lesson && lesson.token === myToken; }
    r.onresult = function (ev) {
      if (!alive()) return;
      var heard = [];
      try {
        for (var i = 0; i < ev.results.length; i++) {
          for (var j = 0; j < ev.results[i].length; j++) {
            var alt = ev.results[i][j];
            if (alt && alt.transcript) heard.push(String(alt.transcript));
          }
        }
      } catch (e) { /* unvollständiges Ergebnis */ }
      if (!heard.length) return;
      handled = true;
      if (matchSpoken(heard, task.item)) {
        stopSpeech();
        ui.idle();
        answerCorrect(task.item.fr);
      } else {
        ui.info("Verstanden: « " + heard[0].replace(/^\s+|\s+$/g, "") + " ». Probier es noch einmal.");
      }
    };
    r.onerror = function (ev) {
      if (!alive()) return;
      var code = ev && ev.error;
      if (code === "aborted") return;
      handled = true;
      ui.warn(MIC_ERRORS[code] || "Das hat nicht geklappt. Versuch es noch einmal oder tippe die Antwort.");
    };
    r.onend = function () {
      if (rec === r) rec = null;
      if (recTimer) { clearTimeout(recTimer); recTimer = null; }
      if (!alive()) return;
      ui.idle();
      if (!handled) ui.info(MIC_ERRORS["no-speech"]);
    };
    try {
      r.start();
      rec = r;
      ui.listening();
      recTimer = setTimeout(function () { try { r.stop(); } catch (e) { /* egal */ } }, 9000);
    } catch (e) {
      rec = null;
      ui.warn("Das Mikrofon konnte nicht gestartet werden. Tippe die Antwort ins Feld.");
    }
  }

  /* ================= Ablauf einer Übung ================= */
  var lesson = null;
  function startLesson(index) {
    var step = STEPS[index];
    var queue = buildTasks(step);
    lesson = {
      index: index, step: step,
      queue: queue,
      isReview: step.type === "review",
      total: step.type === "review" ? queue.length : PER_STEP,
      mastered: 0, answered: 0, mistakes: 0, earned: 0,
      locked: false, timer: null, token: 0, current: null
    };
    show("lesson");
    updateLessonBar();
    nextTask();
  }
  function endLesson() {
    stopSpeech();
    if (lesson && lesson.timer) clearTimeout(lesson.timer);
    lesson = null;
    hideFeedback();
  }
  function updateLessonBar() {
    if (!lesson) return;
    var progress = lesson.isReview ? lesson.answered : lesson.mastered;
    $("track-fill").style.width = (lesson.total ? Math.round(progress / lesson.total * 100) : 100) + "%";
    $("track").setAttribute("aria-valuemax", String(lesson.total));
    $("track").setAttribute("aria-valuenow", String(progress));
    $("lesson-gems").textContent = String(state.gems);
  }
  function nextTask() {
    if (!lesson) return;
    stopSpeech();
    if (lesson.timer) { clearTimeout(lesson.timer); lesson.timer = null; }
    lesson.token++;
    hideFeedback();
    if (!lesson.queue.length) { finishLesson(); return; }
    lesson.current = lesson.queue.shift();
    lesson.locked = false;
    renderTask(lesson.current);
  }
  function answerCorrect(detail) {
    if (!lesson || lesson.locked) return;
    lesson.locked = true;
    stopSpeech();
    lesson.mastered++;
    lesson.answered++;
    if (lesson.isReview) listRemove(lesson.current.vi);   // gewusst: runter von der Fehlerliste
    lesson.earned += GEMS_PER_ANSWER;
    state.gems += GEMS_PER_ANSWER;
    saveState();
    updateLessonBar();
    showFeedback("good", pick(PRAISE) + " +" + GEMS_PER_ANSWER + " 💎", detail || "", "", null, false);
    lesson.timer = setTimeout(nextTask, ADVANCE_MS);
  }
  function answerWrong(head, detail, sub, speakText) {
    if (!lesson || lesson.locked) return;
    lesson.locked = true;
    stopSpeech();
    lesson.mistakes++;
    lesson.answered++;
    if (lesson.isReview) {
      // In der Wiederholung gibt es keine zweite Chance: das Wort rückt ans Ende der Fehlerliste.
      listRemove(lesson.current.vi);
      state.review.push(lesson.current.vi);
      sub = (sub ? sub + " · " : "") + "Kommt in der nächsten Wiederholung wieder.";
      updateLessonBar();
    } else {
      lesson.current.retry = true;
      lesson.queue.push(lesson.current);   // Retry-Queue: kommt am Ende des Steps wieder
      if (lesson.current.vi !== undefined && state.review.indexOf(lesson.current.vi) < 0) state.review.push(lesson.current.vi);
    }
    saveState();
    showFeedback("bad", head, detail, sub, speakText, true);
  }
  function listRemove(vi) {
    var at = state.review.indexOf(vi);
    if (at >= 0) state.review.splice(at, 1);
  }
  function showFeedback(kind, head, detail, sub, speakText, withContinue) {
    var box = $("feedback"), inner = $("feedback-inner");
    clear(inner);
    inner.appendChild(el("p", "head", head));
    if (detail) inner.appendChild(el("p", "detail", detail));
    if (sub) inner.appendChild(el("p", "sub", sub));
    if (withContinue) {
      var actions = el("div", "actions");
      if (speakText && canSpeakOut) actions.appendChild(soundButton(speakText));
      var go = el("button", "wide", "Weiter");
      go.type = "button";
      go.addEventListener("click", nextTask);
      actions.appendChild(go);
      inner.appendChild(actions);
    }
    box.className = "feedback show " + kind;
  }
  function hideFeedback() { $("feedback").className = "feedback"; }

  function taskHeader(body, text, task) {
    if (task.retry) body.appendChild(el("span", "tag", "Wiederholung"));
    body.appendChild(el("h2", "kicker", text));
  }
  function renderTask(task) {
    var body = $("lesson-body");
    clear(body);
    if (task.kind === "mc") renderMC(body, task);
    else if (task.kind === "speak") renderSpeak(body, task);
    else renderCloze(body, task);
  }

  // Französisch → Deutsch, Multiple Choice
  function renderMC(body, task) {
    taskHeader(body, "Was bedeutet das auf Deutsch?", task);
    var prompt = el("div", "prompt");
    var text = el("div", "text", task.item.fr);
    text.lang = "fr";
    if (task.item.note) { var n = el("small", null, task.item.note); n.lang = "de"; text.appendChild(n); }
    prompt.appendChild(text);
    if (canSpeakOut) prompt.appendChild(soundButton(sayText(task.item)));
    body.appendChild(prompt);

    var box = el("div", "options");
    var buttons = [];
    mcOptions(task).forEach(function (optionText) {
      var b = el("button", "opt", optionText);
      b.type = "button";
      b.addEventListener("click", function () {
        if (!lesson || lesson.locked) return;
        var right = optionText === task.item.de;
        buttons.forEach(function (o) {
          o.button.disabled = true;
          if (o.text === task.item.de) o.button.classList.add("good");
        });
        if (right) {
          answerCorrect("");
        } else {
          b.classList.add("bad");
          answerWrong("Nicht ganz. Richtig ist:", task.item.fr + " = " + task.item.de, "", sayText(task.item));
        }
      });
      buttons.push({ button: b, text: optionText });
      box.appendChild(b);
    });
    body.appendChild(box);
  }

  // Grammatik & Lückentext
  function renderCloze(body, task) {
    var item = task.item;
    taskHeader(body, item.form ? "Welche Form passt in die Lücke?" : "Was passt in die Lücke?", task);
    var prompt = el("div", "prompt sentence");
    var text = el("div", "text");
    text.lang = "fr";
    var gaps = [];
    item.s.split("~").forEach(function (part, i) {
      if (i > 0) {
        var gap = el("span", "gap", " ");
        gaps.push(gap);
        text.appendChild(gap);
      }
      if (part) text.appendChild(document.createTextNode(part));
    });
    prompt.appendChild(text);
    body.appendChild(prompt);

    var all = [item.a].concat(item.o);
    var longest = Math.max.apply(null, all.map(function (t) { return t.length; }));
    var box = el("div", longest > 14 ? "options" : "options two");
    var buttons = [];
    shuffle(all).forEach(function (optionText) {
      var b = el("button", "opt", optionText);
      b.type = "button";
      b.lang = "fr";
      b.addEventListener("click", function () {
        if (!lesson || lesson.locked) return;
        var right = optionText === item.a;
        buttons.forEach(function (o) {
          o.button.disabled = true;
          if (o.text === item.a) o.button.classList.add("good");
        });
        gaps.forEach(function (g) { g.textContent = item.a; });
        var full = item.s.split("~").join(item.a);
        if (right) {
          answerCorrect("");
        } else {
          b.classList.add("bad");
          answerWrong("Nicht ganz. Richtig ist:", full, item.de || (task.vocab.fr + " = " + task.vocab.de), full);
        }
      });
      buttons.push({ button: b, text: optionText });
      box.appendChild(b);
    });
    body.appendChild(box);
  }

  // Deutsch → Französisch, Einsprechen
  function renderSpeak(body, task) {
    var item = task.item;
    taskHeader(body, "Sag es auf Französisch", task);
    var prompt = el("div", "prompt");
    var text = el("div", "text", item.de);
    text.lang = "de";
    prompt.appendChild(text);
    body.appendChild(prompt);

    var area = el("div", "speak");
    var status = el("p", "status");
    status.setAttribute("aria-live", "polite");
    var mic = null;
    var ui = {
      idle: function () { if (mic) { mic.classList.remove("listening"); mic.setAttribute("aria-label", "Mikrofon: tippen und sprechen"); } },
      listening: function () {
        if (mic) { mic.classList.add("listening"); mic.setAttribute("aria-label", "Aufnahme läuft, zum Stoppen tippen"); }
        status.className = "status";
        status.textContent = "Ich höre zu …";
      },
      info: function (t) { status.className = "status"; status.textContent = t; },
      warn: function (t) { status.className = "status warn"; status.textContent = t; }
    };
    if (Recognition) {
      mic = el("button", "mic");
      mic.type = "button";
      mic.appendChild(icon("speak"));
      mic.addEventListener("click", function () { listen(task, ui); });
      ui.idle();
      ui.info("Tippe aufs Mikrofon und sprich das Wort.");
      area.appendChild(mic);
    } else {
      ui.warn("Dieser Browser hat keine Spracherkennung. Öffne die Seite in Chrome, Edge oder Safari. Bis dahin kannst du die Antwort tippen.");
    }
    area.appendChild(status);

    var input = el("input", "typed");
    input.type = "text";
    input.id = "typed-answer";
    input.lang = "fr";
    input.placeholder = "oder hier auf Französisch tippen";
    input.setAttribute("aria-label", "Antwort auf Französisch tippen");
    input.setAttribute("autocomplete", "off");
    input.setAttribute("autocapitalize", "off");
    input.setAttribute("autocorrect", "off");
    input.setAttribute("spellcheck", "false");
    input.setAttribute("enterkeyhint", "done");
    input.addEventListener("input", function () {
      // Getippte Antworten zählen automatisch, sobald sie stimmen.
      if (matchTyped(input.value, item)) { input.blur(); answerCorrect(item.fr); }
    });
    input.addEventListener("keydown", function (ev) {
      if (ev.key !== "Enter") return;
      ev.preventDefault();
      if (matchTyped(input.value, item)) { input.blur(); answerCorrect(item.fr); return; }
      input.classList.remove("shake");
      void input.offsetWidth;
      input.classList.add("shake");
      ui.info("Das stimmt noch nicht ganz. Prüfe die Schreibweise.");
    });
    area.appendChild(input);

    var unknown = el("button", "wide ghost", "Weiß ich nicht – Lösung zeigen");
    unknown.type = "button";
    unknown.addEventListener("click", function () {
      answerWrong("Die Lösung ist:", item.fr, item.note || "", sayText(item));
    });
    area.appendChild(unknown);
    body.appendChild(area);
  }

  function finishLesson() {
    var done = lesson;
    var perfect = done.mistakes === 0;
    var before = state.done[done.step.id] || 0;
    state.done[done.step.id] = Math.max(before, perfect ? 2 : 1);
    if (done.total > 0) countDayForStreak();
    saveState();
    endLesson();

    var title, text;
    if (done.isReview) {
      var left = state.review.length;
      var rest = left ? " Auf der Fehlerliste " + (left === 1 ? "steht noch 1 Wort" : "stehen noch " + left + " Wörter") + " für die nächste Wiederholung." : " Deine Fehlerliste ist leer.";
      if (done.total === 0) { title = "Nichts zu wiederholen! ★"; text = "Auf deiner Fehlerliste steht kein Wort."; }
      else if (perfect) { title = "Wiederholung fehlerfrei! ★"; text = "Alle " + done.total + " Fehlerwörter gewusst." + rest; }
      else { title = "Wiederholung geschafft!"; text = (done.total - done.mistakes) + " von " + done.total + " gewusst." + rest; }
    } else if (perfect) {
      title = "Fehlerfrei geschafft! ★"; text = "Alle 7 Aufgaben auf Anhieb richtig. Dafür gibt es den Goldstern.";
    } else {
      title = "Step geschafft!"; text = "Du hast alle 7 Aufgaben gemeistert. Die Fehlerwörter kommen im nächsten Wiederholungsknoten noch einmal.";
    }
    $("result-title").textContent = title;
    $("result-text").textContent = text;
    $("stat-gems").textContent = "+" + done.earned;
    $("stat-mistakes").textContent = String(done.mistakes);
    $("stat-streak").textContent = String(currentStreak());
    show("result");
  }

  /* ================= PWA: Icon und Manifest ================= */
  function setupInstall() {
    try {
      var svgUrl = $("app-icon").getAttribute("href");
      $("top-mascot").src = svgUrl;
      $("result-mascot").src = svgUrl;
      if (!/^https?:$/.test(window.location.protocol)) return;   // lokal geöffnete Datei: kein Manifest möglich
      var img = new Image();
      var written = false;
      var write = function (icons) {
        if (written) return;
        written = true;
        try {
          var here = window.location.href.split("#")[0].split("?")[0];
          var manifest = {
            name: "À plus ! 3 Vokabelpfad",
            short_name: "À plus ! 3",
            lang: "de",
            start_url: here,
            scope: here.replace(/[^\/]*$/, ""),
            display: "standalone",
            orientation: "portrait",
            background_color: "#ffffff",
            theme_color: "#58cc02",
            icons: icons
          };
          var link = document.createElement("link");
          link.rel = "manifest";
          link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
          document.head.appendChild(link);
        } catch (e) { /* ohne Manifest bleibt „Zum Startbildschirm“ über die Meta-Tags möglich */ }
      };
      var svgOnly = [{ src: svgUrl, sizes: "any", type: "image/svg+xml", purpose: "any" }];
      img.onload = function () {
        var icons = svgOnly.slice();
        try {
          [192, 512].forEach(function (size) {
            var c = document.createElement("canvas");
            c.width = size; c.height = size;
            c.getContext("2d").drawImage(img, 0, 0, size, size);
            icons.push({ src: c.toDataURL("image/png"), sizes: size + "x" + size, type: "image/png", purpose: "any maskable" });
          });
        } catch (e) { icons = svgOnly; }
        write(icons);
      };
      img.onerror = function () { write(svgOnly); };
      img.src = svgUrl;
    } catch (e) { /* Icon ist nur Zierde */ }
  }

  /* ================= Start ================= */
  function init() {
    setupInstall();
    renderLegend();
    $("close-btn").addEventListener("click", goHome);
    $("result-btn").addEventListener("click", goHome);
    $("reset-btn").addEventListener("click", onReset);
    var resizeTimer = null;
    window.addEventListener("resize", function () {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(drawTrail, 120);
    });
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        var hadRec = !!rec;
        stopSpeech();
        if (hadRec) { var m = document.querySelector(".mic"); if (m) m.classList.remove("listening"); }
      } else if (!$("home").hidden) {
        renderTopbar();
      }
    });
    if (CLOZE.length !== VOCAB.length) throw new Error("Daten unvollständig");
    show("home");
    renderHome();
    try { if ("scrollRestoration" in window.history) window.history.scrollRestoration = "manual"; } catch (e) { /* egal */ }
    if (openSteps()[0] > 0) scrollToCurrent();   // beim Wiederöffnen direkt zum aktuellen Step
    saveState();
  }
  try {
    init();
  } catch (err) {
    var fallback = document.createElement("p");
    fallback.style.padding = "24px";
    fallback.style.fontWeight = "700";
    fallback.textContent = "Die App konnte nicht starten. Bitte lade die Seite neu. (" + (err && err.message ? err.message : "unbekannter Fehler") + ")";
    document.body.appendChild(fallback);
  }
})();
</script>
</body>
